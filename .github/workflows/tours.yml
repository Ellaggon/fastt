name: Tours Release Gates

on:
  pull_request:
    paths:
      - "src/lib/tours/**"
      - "src/pages/tours/**"
      - "src/pages/booking/**"
      - "src/pages/api/booking/**"
      - "src/pages/api/inventory/**"
      - "src/pages/api/tours/**"
      - "src/pages/api/reviews/**"
      - "src/pages/api/trips/**"
      - "src/pages/api/internal/observability/**"
      - "src/pages/admin/tours/**"
      - "src/components/tours/**"
      - "src/modules/catalog/**"
      - "src/modules/booking/**"
      - "db/migrations/**tour*"
      - "db/postgres/**"
      - "docs/engineering/tours-*"
      - "docs/ops/tours-*"
      - "tests/catalog/tour-*"
      - "tests/integration/tour-*"
      - "tests/guardrails/tour-*"
      - "tests/policies/cancellation-hours-deadline.test.ts"
      - "scripts/db/validate-tour-*"
      - "scripts/ops/tours-*"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/tours.yml"
  push:
    branches:
      - main
    paths:
      - "src/lib/tours/**"
      - "src/pages/tours/**"
      - "src/pages/booking/**"
      - "src/pages/api/booking/**"
      - "src/pages/api/inventory/**"
      - "src/pages/api/tours/**"
      - "src/pages/api/reviews/**"
      - "src/pages/api/trips/**"
      - "src/pages/api/internal/observability/**"
      - "src/pages/admin/tours/**"
      - "src/components/tours/**"
      - "src/modules/catalog/**"
      - "src/modules/booking/**"
      - "db/migrations/**tour*"
      - "db/postgres/**"
      - "docs/engineering/tours-*"
      - "docs/ops/tours-*"
      - "tests/catalog/tour-*"
      - "tests/integration/tour-*"
      - "tests/guardrails/tour-*"
      - "tests/policies/cancellation-hours-deadline.test.ts"
      - "scripts/db/validate-tour-*"
      - "scripts/ops/tours-*"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/tours.yml"
  workflow_dispatch:

jobs:
  tours:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fastt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fastt"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fastt
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fastt
      FASTT_DATA_ENV: development
      TOURS_CHECKOUT_ENABLED: "true"
      TOURS_CHECKIN_ENABLED: "true"
      TOURS_PUBLIC_SEARCH_ENABLED: "true"
      TOURS_REFUND_HOURS_ENABLED: "true"
      TOURS_ROLLOUT_STAGE: general
      TOURS_ROLLOUT_MIN_DWELL_MS: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install canonical schema
        run: psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f db/postgres/0001_initial_schema.sql

      - name: Generate Astro types
        run: pnpm exec astro sync

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Astro check
        run: pnpm run check

      - name: Build
        run: pnpm run build

      - name: Lint Tours surfaces
        run: pnpm run lint:tours

      - name: UI guardrail
        run: pnpm run check:ui

      - name: Postgres schema parity
        env:
          FASTT_DATA_ENV: test
          DATABASE_URL: ""
          DIRECT_URL: ""
          FASTT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fastt
          FASTT_TEST_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fastt
          FASTT_TEST_DATABASE_FINGERPRINT: dbfp_80c3df721bfbe036eaf8
          FASTT_PRODUCTION_DATABASE_FINGERPRINTS: dbfp_production_not_local
        run: pnpm exec vitest run tests/architecture/postgres-schema-parity.test.ts

      - name: P0 gates (slot-profile + occupancy key)
        env:
          FASTT_DATA_ENV: test
          DATABASE_URL: ""
          DIRECT_URL: ""
          FASTT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fastt
          FASTT_TEST_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fastt
          FASTT_TEST_DATABASE_FINGERPRINT: dbfp_80c3df721bfbe036eaf8
          FASTT_PRODUCTION_DATABASE_FINGERPRINTS: dbfp_production_not_local
        run: pnpm exec vitest run tests/catalog/tour-slot-profile.test.ts tests/guardrails/no-manual-occupancy-key.test.ts

      - name: Prometheus rules + Alertmanager fragments
        run: pnpm run ops:tours-prometheus-rules

      - name: Redis multipod counter check
        # Soft-skip (exit 2) when Upstash/Redis is not configured in the runner.
        run: |
          set +e
          pnpm run ops:tours-redis-multipod
          code=$?
          if [ "$code" -eq 0 ] || [ "$code" -eq 2 ]; then exit 0; fi
          exit "$code"

      - name: Tour migration validators (idempotent apply)
        run: |
          pnpm run db:validate:tour-category-backfill
          pnpm run db:validate:tour-p2-trust

      - name: Tours browser-surface contracts
        env:
          FASTT_DATA_ENV: test
          DATABASE_URL: ""
          DIRECT_URL: ""
          FASTT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fastt
          FASTT_TEST_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fastt
          FASTT_TEST_DATABASE_FINGERPRINT: dbfp_80c3df721bfbe036eaf8
          FASTT_PRODUCTION_DATABASE_FINGERPRINTS: dbfp_production_not_local
        run: pnpm exec vitest run tests/catalog/tour-pdp-browser-surface.test.ts tests/catalog/tour-ticket-occupancy.test.ts tests/catalog/tour-canary-observation.test.ts

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Tours Playwright smoke (PDP hold + day-of)
        run: pnpm run test:tours:playwright

      - name: Tours phase6 suite
        env:
          FASTT_DATA_ENV: test
          DATABASE_URL: ""
          DIRECT_URL: ""
          FASTT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fastt
          FASTT_TEST_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fastt
          FASTT_TEST_DATABASE_FINGERPRINT: dbfp_80c3df721bfbe036eaf8
          FASTT_PRODUCTION_DATABASE_FINGERPRINTS: dbfp_production_not_local
        run: pnpm run test:tours:phase6

      - name: Canary observation snapshot (local dry-run)
        run: |
          mkdir -p artifacts/tours-canary
          TOURS_CANARY_SNAPSHOT_LABEL=ci-dry-run \
          TOURS_CANARY_SNAPSHOT_OUT=artifacts/tours-canary/ci-dry-run.json \
            pnpm run ops:tours-canary-snapshot

      - name: Upload canary snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: tours-canary-snapshot
          path: artifacts/tours-canary/
          if-no-files-found: error
