name: Architecture Guardrails

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  guardrails:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fastt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fastt"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FASTT_DATA_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fastt
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fastt
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install canonical schema
        run: psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f db/postgres/0001_initial_schema.sql

      - name: Generate Astro types
        run: pnpm exec astro sync

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Astro check
        run: pnpm run check

      - name: UI guardrail
        run: pnpm run check:ui

      - name: Guardrails suite
        env:
          FASTT_DATA_ENV: test
          DATABASE_URL: ""
          DIRECT_URL: ""
          FASTT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fastt
          FASTT_TEST_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fastt
          FASTT_TEST_DATABASE_FINGERPRINT: dbfp_80c3df721bfbe036eaf8
          FASTT_PRODUCTION_DATABASE_FINGERPRINTS: dbfp_production_not_local
        run: pnpm test tests/guardrails

      - name: Canonical geography contracts
        env:
          FASTT_DATA_ENV: test
          DATABASE_URL: ""
          DIRECT_URL: ""
          SUPABASE_DB_POOLER_URL: ""
        run: pnpm exec vitest run tests/catalog/geo-place-schema.test.ts tests/catalog/geo-place-compatibility.test.ts tests/catalog/create-product.test.ts tests/marketplace/public-destination-routes.test.ts tests/marketplace/public-marketplace-certification.test.ts tests/marketplace/public-seo-certification.test.ts

      - name: Governance capability suite (enforced)
        env:
          FASTT_DATA_ENV: test
          DATABASE_URL: ""
          DIRECT_URL: ""
          FASTT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fastt
          FASTT_TEST_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fastt
          FASTT_TEST_DATABASE_FINGERPRINT: dbfp_80c3df721bfbe036eaf8
          FASTT_PRODUCTION_DATABASE_FINGERPRINTS: dbfp_production_not_local
        run: pnpm run test:governance

      - name: Full test suite
        env:
          FASTT_DATA_ENV: test
          DATABASE_URL: ""
          DIRECT_URL: ""
          FASTT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fastt
          FASTT_TEST_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fastt
          FASTT_TEST_DATABASE_FINGERPRINT: dbfp_80c3df721bfbe036eaf8
          FASTT_PRODUCTION_DATABASE_FINGERPRINTS: dbfp_production_not_local
        run: pnpm test

  geography-retirement-certification:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fastt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fastt"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FASTT_DATA_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fastt
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fastt
      CONFIRM_MARKETPLACE_COMMERCIAL_CERTIFICATION: apply
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate canonical initial schema
        run: |
          pnpm run db:pg:generate-initial
          git diff --exit-code -- db/postgres/0001_initial_schema.sql

      - name: Install clean schema
        run: psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f db/postgres/0001_initial_schema.sql

      - name: Verify clean schema matches the canonical Drizzle inventory
        run: pnpm run db:pg:verify-initial -- --fresh

      - name: Seed canonical geography
        run: pnpm run seed:geo:bolivia

      - name: Certify creation contracts against the isolated database
        env:
          FASTT_DATA_ENV: test

          DATABASE_URL: ""
          DIRECT_URL: ""
          FASTT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fastt
          FASTT_TEST_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fastt
          FASTT_TEST_DATABASE_FINGERPRINT: dbfp_80c3df721bfbe036eaf8
          FASTT_PRODUCTION_DATABASE_FINGERPRINTS: dbfp_production_not_local
        run: pnpm exec vitest run tests/integration/product-api.test.ts tests/integration/tour-wizard-create.test.ts

      - name: Certify marketplace commercial journey
        env:
          FASTT_DATA_ENV: test
          DATABASE_URL: ""
          DIRECT_URL: ""
          FASTT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fastt
          FASTT_TEST_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fastt
          FASTT_TEST_DATABASE_FINGERPRINT: dbfp_80c3df721bfbe036eaf8
          FASTT_PRODUCTION_DATABASE_FINGERPRINTS: dbfp_production_not_local
        run: pnpm run certify:marketplace:commercial -- --apply

      - name: Verify irreversible geography retirement
        run: pnpm run audit:geo:retirement -- --final

  public-certification:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fastt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fastt"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FASTT_DATA_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fastt
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fastt
      CONFIRM_MARKETPLACE_COMMERCIAL_CERTIFICATION: apply
      FASTT_HTML_BUDGET_REQUIRED: "1"
      FASTT_HTML_BUDGET_PUBLIC_ONLY: "1"
      FASTT_HTML_BUDGET_MAX_TTFB_MS: "1200"
      PLAYWRIGHT_PUBLIC_CERTIFICATION: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare isolated public catalog
        run: psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f db/postgres/0001_initial_schema.sql

      - name: Verify public catalog schema matches the canonical Drizzle inventory
        run: pnpm run db:pg:verify-initial -- --fresh

      - name: Seed canonical geography
        run: pnpm run seed:geo:bolivia

      - name: Prepare and certify commercial fixtures
        env:
          FASTT_DATA_ENV: test
          DATABASE_URL: ""
          DIRECT_URL: ""
          FASTT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fastt
          FASTT_TEST_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fastt
          FASTT_TEST_DATABASE_FINGERPRINT: dbfp_80c3df721bfbe036eaf8
          FASTT_PRODUCTION_DATABASE_FINGERPRINTS: dbfp_production_not_local
        run: pnpm run certify:marketplace:commercial -- --apply

      - name: Build public app
        run: pnpm build

      - name: Public browser, accessibility, HTML and render budget
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4178
          PLAYWRIGHT_PUBLIC_ROUTES: "/,/hotels,/tours,/destinos/la-paz/alojamientos,/destinos/la-paz/tours"
          FASTT_HTML_BUDGET_BASE_URL: http://127.0.0.1:4178
          FASTT_HTML_BUDGET_ROUTES: "/:250000,/hotels:335000,/tours:345000,/destinos/la-paz/alojamientos:305000,/destinos/la-paz/tours:460000"
        run: |
          pnpm exec astro preview --host 127.0.0.1 --port 4178 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            if curl -sf http://127.0.0.1:4178/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:4178/ >/dev/null
          pnpm run test:marketplace:public-browser
          pnpm run perf:html-budget
