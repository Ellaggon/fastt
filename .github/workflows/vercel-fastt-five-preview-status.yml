name: Vercel preview status reconciliation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  status:

permissions:
  statuses: write

jobs:
  reconcile-fastt-five:
    if: >
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'status' &&
        github.event.context == 'Vercel – fastt-five' &&
        github.event.state == 'failure'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Mark fastt-five preview as covered by primary Vercel project
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event_name == 'status' && github.event.sha || github.event.pull_request.head.sha }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${SHA}" \
            -f state=success \
            -f context='Vercel – fastt-five' \
            -f description='Preview covered by Vercel – fastt (fastt-five previews suppressed)' \
            -f target_url="https://vercel.com/ellaggons-projects/fastt"

  reconcile-fastt-rate-limit:
    if: >
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'status' &&
        (github.event.context == 'Vercel' || github.event.context == 'Vercel – fastt') &&
        github.event.state == 'failure' &&
        contains(github.event.description, 'rate limited')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Unblock PR when Hobby deploy quota prevents a fresh preview
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event_name == 'status' && github.event.sha || github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_CONTEXT: ${{ github.event.context }}
        run: |
          context="${EVENT_CONTEXT:-Vercel}"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            match=$(gh api "repos/${{ github.repository }}/commits/${SHA}/status" --jq '
              [.statuses[]
                | select(.context == "Vercel" or .context == "Vercel – fastt")
                | select(.state == "failure")
                | select(.description | test("rate limited"; "i"))
              ][0] // empty
            ')
            if [ -z "$match" ] || [ "$match" = "null" ]; then
              echo "No Hobby rate-limit failure on Vercel; leaving the status unchanged."
              exit 0
            fi
            context=$(printf '%s' "$match" | jq -r '.context')
          fi
          gh api "repos/${{ github.repository }}/statuses/${SHA}" \
            -f state=success \
            -f context="$context" \
            -f description='Hobby deploy quota hit; merge-safe while CI is green — redeploy preview when quota resets' \
            -f target_url="https://vercel.com/ellaggons-projects/fastt"
