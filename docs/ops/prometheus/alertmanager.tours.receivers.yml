# Alertmanager route/receiver fragment for Tours canary alerts.
# Merge into Alertmanager config. Drill: fire → ack → resolve by restoring ratios.

route:
  receiver: default
  group_by: [alertname, vertical]
  routes:
    - matchers:
        - vertical = "tours"
      receiver: tours-rollout-ops
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      continue: false

receivers:
  - name: tours-rollout-ops
    # Replace with your pager/Slack/webhook.
    webhook_configs:
      - url: https://example.com/hooks/tours-rollout
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - alertname = "ToursHoldConfirmBelowBaseline"
      - severity = "critical"
    target_matchers:
      - alertname = "ToursRolloutAlertFiring"
    equal: [vertical]
