# Prometheus alerting rules for Tours canary rollout.
# Wire into Prometheus rule_files / Alertmanager. Drill: fire → ack → resolve by restoring ratios.
groups:
  - name: tours-rollout
    rules:
      - alert: ToursHoldConfirmBelowBaseline
        expr: |
          tours_rollout_hold_to_confirm_ratio{cohort="canary"}
            < on() group_left tours_rollout_baseline_min_hold_confirm_rate
          and tours_rollout_health{status="healthy"} == 1
            or tours_rollout_alert{code="tours_hold_confirm_below_baseline"} == 1
        for: 15m
        labels:
          severity: critical
          vertical: tours
        annotations:
          summary: Tours hold→confirm below canary baseline
          description: Conversion regressed during Tours canary. Do not expand stage.
          runbook: docs/engineering/tours-rollout-canary.md

      - alert: ToursHoldFailureRateHigh
        expr: tours_rollout_alert{code="tours_hold_failure_rate_high"} == 1
        for: 15m
        labels:
          severity: critical
          vertical: tours
        annotations:
          summary: Tours hold failure rate above baseline
          description: Hard hold failures exceeded TOURS_ROLLOUT_MAX_HOLD_FAILURE_RATE.
          runbook: docs/engineering/tours-rollout-canary.md

      - alert: ToursRedeemIssuedBelowBaseline
        expr: tours_rollout_alert{code="tours_redeem_issued_below_baseline"} == 1
        for: 15m
        labels:
          severity: warning
          vertical: tours
        annotations:
          summary: Tours voucher redeem/issued below baseline
          description: Check-in / redeem path may be broken for canary cohort.
          runbook: docs/engineering/tours-rollout-canary.md

      - alert: ToursRefundQuoteAppliedGap
        expr: tours_rollout_alert{code="tours_refund_quote_vs_applied_gap"} == 1
        for: 15m
        labels:
          severity: warning
          vertical: tours
        annotations:
          summary: Tours refund quote→applied gap above baseline
          description: Quoted refunds are not being applied consistently.
          runbook: docs/engineering/tours-rollout-canary.md

      - alert: ToursRefundAmountMismatch
        expr: tours_rollout_alert{code="tours_refund_amount_mismatch"} == 1
        for: 5m
        labels:
          severity: critical
          vertical: tours
        annotations:
          summary: Tours refund amount mismatch detected
          description: Applied refund amount diverged from quote. Investigate before expand.
          runbook: docs/engineering/tours-rollout-canary.md

      - alert: ToursRolloutAlertFiring
        expr: tours_rollout_alert_firing > 0
        for: 15m
        labels:
          severity: warning
          vertical: tours
        annotations:
          summary: Tours rollout has active baseline alerts
          description: See /admin/tours/rollout and tours_rollout_alert series.
          runbook: docs/engineering/tours-rollout-canary.md
