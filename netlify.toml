# Evaluation site uses explicitly authorized shared beta DB/Auth credentials.
# Application command guards are not SQL read-only; scheduled tasks stay disabled.
[build]
command = "pnpm run build"
publish = "dist"

[build.environment]
FASTT_DOCUMENT_PIPELINE_ENABLED = "false"
# This public environment label was imported as secret. Its literal value occurs
# throughout the source; keep scanning all credentials and every other key.
SECRETS_SCAN_OMIT_KEYS = "FASTT_DATA_ENV"
